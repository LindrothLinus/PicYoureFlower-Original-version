server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:

        # ── Auth Service (port 8081) ──────────────────────────────────────────
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # ── Flower Service (port 8083) ────────────────────────────────────────
        - id: flower-identify
          uri: http://localhost:8083
          predicates:
            - Path=/home/identify

        - id: flower-color
          uri: http://localhost:8083
          predicates:
            - Path=/home/color

        - id: flower-add
          uri: http://localhost:8083
          predicates:
            - Path=/home/add

        - id: flower-all
          uri: http://localhost:8083
          predicates:
            - Path=/home/all

        - id: flower-delete
          uri: http://localhost:8083
          predicates:
            - Path=/home/deleteflower/**

        - id: flower-assign-user
          uri: http://localhost:8083
          predicates:
            - Path=/home/addfloweruser/**

        - id: flower-wiki
          uri: http://localhost:8083
          predicates:
            - Path=/home/wikiinfo/**

        - id: flower-by-user
          uri: http://localhost:8083
          predicates:
            - Path=/home/user/*/flowers

        # ── User Service (port 8082) ──────────────────────────────────────────
        - id: user-all
          uri: http://localhost:8082
          predicates:
            - Path=/home/allusers

        - id: user-add
          uri: http://localhost:8082
          predicates:
            - Path=/home/adduser

        - id: user-coins-get
          uri: http://localhost:8082
          predicates:
            - Path=/home/coins/**

        - id: user-coins-add
          uri: http://localhost:8082
          predicates:
            - Path=/home/addcoins/**

        - id: user-pots-get
          uri: http://localhost:8082
          predicates:
            - Path=/home/userpots/**

        - id: user-pot-add
          uri: http://localhost:8082
          predicates:
            - Path=/home/addpot/**

        - id: user-pots-all
          uri: http://localhost:8082
          predicates:
            - Path=/home/allpots

        - id: user-friends
          uri: http://localhost:8082
          predicates:
            - Path=/home/friends/**

        - id: user-hello
          uri: http://localhost:8082
          predicates:
            - Path=/home/hello
            
        - id: user-setcoins
          uri: http://localhost:8082
          predicates:
            - Path=/home/setcoins/**

        - id: user-addfriend
          uri: http://localhost:8082
          predicates:
            - Path=/home/addfriend/**

        - id: user-removefriend
          uri: http://localhost:8082
          predicates:
            - Path=/home/removefriend/**

        # Internal user REST API used by auth-service
        - id: users-internal
          uri: http://localhost:8082
          predicates:
            - Path=/users/**

management:
  endpoints:
    web:
      exposure:
        include: health,info